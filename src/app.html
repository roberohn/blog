<!doctype html>
<html lang="en">
	<head>
		<link rel="alternate" type="application/atom+xml" href="/rss.xml" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Personal blog and portfolio of John Roberts, with topics covering software development, automation and general likes and hobbies."
		/>
		<meta property="og:title" content="Personal blog and portfolio of John Roberts" />
		<meta property="og:url" content="https://www.imjr.me" />
		<meta
			property="og:description"
			content="Personal blog and portfolio of John Roberts, with topics covering software development, automation and general likes and hobbies."
		/>
		<meta property="og:image" content="/og-image/og-image.jpeg" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
		<link rel="manifest" href="/favicon_io/site.webmanifest" />
		<link ref="canonical" href="https://www.imjr.me" />
		%sveltekit.head%
		<script type="module">
			const theme = localStorage.getItem('color-scheme');

			theme
				? document.documentElement.setAttribute('color-scheme', theme)
				: localStorage.setItem('color-scheme', 'dark');
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
